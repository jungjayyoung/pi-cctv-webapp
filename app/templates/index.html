<!DOCTYPE html>
<html>
<head>
    <title>CCTV</title>
</head>
<body>
    <h1>Live Camera</h1>
    <!-- <img src="{{ url_for('video') }}"> -->
    <button onclick="startVideo()">영상 보기</button>
    <button onclick="stopVideo()">영상 끄기</button>

    <img id="video" width="500">

    <h2>Last Detection</h2>
    <p id="time">No detection yet</p>
    <img id="capture" width="300">

    <br><br>

    <button onclick="requestNotificationPermission()">
        Enable Browser Notification
    </button>

    <script>
        let lastAlertCount = 0;

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    alert("Notification permission: " + permission);
                });
            } else {
                alert("This browser does not support notifications.");
            }
        }

        async function fetchStatus() {
            const res = await fetch("/status");
            const data = await res.json();

            if (data.last_capture) {
                document.getElementById("capture").src =
                    "/captures/" + data.last_capture.split("/").pop();

                document.getElementById("time").innerText = data.time;
            }

            if (data.alert_count > lastAlertCount) {
                lastAlertCount = data.alert_count;

                if (Notification.permission === "granted") {
                    new Notification("CCTV Alert", {
                        body: "사람이 감지되었습니다!"
                    });
                }
            }
        }

        setInterval(fetchStatus, 2000);

        function startVideo() {
            document.getElementById("video").src = "/video";
        }

        function stopVideo() {
            document.getElementById("video").src = "";
        }
    </script>

  
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYkr1pb6-C_UUSL_R64VEyHG9U91JItVo",
            authDomain: "pi-cctv-webapp.firebaseapp.com",
            projectId: "pi-cctv-webapp",
            storageBucket: "pi-cctv-webapp.firebasestorage.app",
            messagingSenderId: "656080298295",
            appId: "1:656080298295:web:2deb3e7fe1bcce4f03fab2",
            measurementId: "G-1QYQQDPFMS"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

      
        async function initFirebaseMessaging() {
            try {
                const permission = await Notification.requestPermission();

                if (permission !== "granted") {
                    alert("알림 권한이 허용되지 않았습니다.");
                    return;
                }

                const registration = await navigator.serviceWorker.register(
                    "/static/firebase-messaging-sw.js"
                );

                console.log("Service Worker registered:", registration);

                const token = await getToken(messaging, {
                    vapidKey: "BJuea2XTDrPwzcpmGNLPBPl0cUHGu5mTEpoP6JebYYicKnCznthsyLumjwN6QV2Fe2NUtDmHUxgxz1gne349ksg",
                    serviceWorkerRegistration: registration
                });

                if (!token) {
                    alert("FCM 토큰을 가져오지 못했습니다.");
                    return;
                }

                console.log("FCM Token:", token);

                await fetch("/save-token", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token })
                });

                alert("Firebase 푸시 등록 완료");

            } catch (error) {
                console.error("Firebase Push Error:", error);
                alert("Firebase Push Error: " + error.message);
            }
        }

        onMessage(messaging, (payload) => {
            new Notification(payload.notification.title, {
                body: payload.notification.body
            });
        });

        window.addEventListener("load", () => {
            initFirebaseMessaging();
        });
    </script>
    
</body>
</html>
